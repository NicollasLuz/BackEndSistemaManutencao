spring.application.name=sistema-manutencao

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/site_manutencao}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.tomcat.max-http-form-post-size=10MB

api.security.token.secret=${JWT_SECRET:chave_mestre_site_manutencao_2026_unicamp}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}